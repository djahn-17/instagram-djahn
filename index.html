<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">Instagram</h1>

        <nav>
            <a href="#"><span>🏠</span> Home</a>
            <a href="#"><span>🔍</span> Search</a>
            <a href="#"><span>🧭</span> Explore</a>
            <a href="#"><span>🎬</span> Reels</a>
            <a href="#"><span>💬</span> Messages</a>
            <a href="#"><span>❤️</span> Notifications</a>
            <a href="#"><span>➕</span> Create</a>

            <a href="#" class="profile-link">
                <img src="IMG-20251206-WA0054.jpg" class="profile-pic">
                <span>Profile</span>
            </a>
        </nav>
    </aside>
    <main class="feed">
        <section class="stories">
            <div class="story">
                <img src="IMG-20251206-WA0051.jpg" onclick="openStory(this.src)">
                <p>juma_chubby</p>
            </div>

            <div class="story">
                <img src="IMG-20251206-WA0052.jpg" onclick="openStory(this.src)">
                <p>saida_snitch</p>
            </div>

            <div class="story">
                <img src="IMG-20251206-WA0053.jpg" onclick="openStory(this.src)">
                <p>abdallah_winga_kkoo</p>
            </div>

            <div class="story">
                <img src="IMG-20251206-WA0050.jpg">
                <p>ayoub_creed</p>
            </div>
        </section>
        <article class="post">

            <header class="post-header">
                <img src="IMG-20251206-WA0054.jpg" class="post-pfp">
                <span class="post-username">jamal_mtulia</span>
                <span class="post-menu">•••</span>
            </header>

            <img src="WhatsApp Image 2025-12-06 at 16.09.35_9fa20f33.jpg" class="post-image">

            <div class="post-actions">
                <i class="fa-regular fa-heart">❤️</i>
                <i class="fa-regular fa-comment">💬</i>
                <i class="fa-solid fa-share">📤</i>
            </div>

        </article>
    </main>
     <aside class="right-panel">

        <div class="user-box">
            <img src="IMG-20251206-WA0054.jpg" class="small-pfp">
            <div>
                <b>jamal_mtulia</b><br>
                <small>Djahn</small>
            </div>
            <a class="switch-btn">Switch</a>
        </div>

        <h4 class="suggest-title">Suggested for you</h4>

        <div class="suggest">
            <img src="anime-girl-tattoo-white-hair-hd-wallpaper-uhdpaper.com-638@5@f.jpg" >
            <div>
                <b>girl_tattoo</b><br>
                <small>Suggested</small>
            </div>
            <a class="follow">Follow</a>
        </div>

        <div class="suggest">
            <img src="anime-girl-dragon-horn-sci-fi-fantasy-hd-wallpaper-uhdpaper.com-604@5@f.jpg">
            <div>
                <b>dragon_horn</b><br>
                <small>Suggested</small>
            </div>
            <a class="follow">Follow</a>
        </div>

    </aside>

</body>
</html>
